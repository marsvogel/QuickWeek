name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: read
    outputs:
      marketing_version: ${{ steps.version.outputs.marketing_version }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: SwiftLint
        env:
          SWIFTLINT_VERSION: 0.65.0
          SWIFTLINT_SHA256: d6cb0aa7a2f5f1ef306fc9e37bcb54dc9a26facc8f7784ac0c3dd3eccf5c6ba6
        run: |
          curl -fsSL -o swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          echo "${SWIFTLINT_SHA256}  swiftlint.zip" | shasum -a 256 -c -
          unzip -o -q swiftlint.zip -d swiftlint-bin
          ./swiftlint-bin/swiftlint lint --strict --reporter github-actions-logging

      - name: Test
        run: |
          xcodebuild test -project QuickWeek.xcodeproj \
            -scheme QuickWeek \
            CODE_SIGN_IDENTITY="-"

      - name: Build (ad-hoc signed)
        run: |
          xcodebuild -project QuickWeek.xcodeproj \
            -target QuickWeek \
            -configuration Release \
            CODE_SIGN_IDENTITY="-" \
            build

      - name: Read versions
        id: version
        run: |
          MARKETING_VERSION=$(xcodebuild -project QuickWeek.xcodeproj \
            -target QuickWeek -configuration Release -showBuildSettings 2>/dev/null \
            | awk '$1 == "MARKETING_VERSION" {print $3; exit}')
          echo "marketing_version=${MARKETING_VERSION}" >> "$GITHUB_OUTPUT"
          echo "build_number=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Package app as ZIP
        run: ditto -c -k --keepParent build/Release/QuickWeek.app QuickWeek.zip

      - name: Compute checksum
        run: shasum -a 256 QuickWeek.zip | tee QuickWeek.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QuickWeek
          path: |
            QuickWeek.zip
            QuickWeek.zip.sha256

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QuickWeek

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: QuickWeek.zip

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v${{ needs.build.outputs.marketing_version }}.${{ needs.build.outputs.build_number }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi
          gh release create "$TAG" QuickWeek.zip QuickWeek.zip.sha256 \
            --title "$TAG" \
            --generate-notes \
            --target "$GITHUB_SHA"
